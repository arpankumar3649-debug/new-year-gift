<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private | For My Munii ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@200;400&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body { margin: 0; background: #050505; color: #fff; font-family: 'Poppins', sans-serif; overflow-x: hidden; }
        
        /* Password Screen Design */
        #pass-screen { 
            height: 100vh; display: flex; flex-direction: column; align-items: center; 
            justify-content: center; text-align: center; background: radial-gradient(circle, #1a0000 0%, #000 100%); 
            z-index: 999; position: fixed; width: 100%; top: 0; left: 0;
        }
        #pass-screen h2 { font-family: 'Great Vibes', cursive; font-size: 2.5rem; color: #ff4757; margin-bottom: 30px; }
        #pass-input { 
            background: rgba(255,255,255,0.05); border: 1px solid #444; padding: 15px; 
            color: #fff; text-align: center; border-radius: 50px; font-size: 1rem; 
            outline: none; transition: 0.3s; width: 250px; letter-spacing: 2px;
        }
        #pass-input:focus { border-color: #ff4757; box-shadow: 0 0 15px rgba(255, 71, 87, 0.4); }
        #pass-btn { 
            margin-top: 25px; background: #ff4757; color: white; border: none; 
            padding: 12px 40px; border-radius: 50px; cursor: pointer; 
            font-weight: 500; letter-spacing: 1px; transition: 0.3s; 
        }
        #pass-btn:hover { background: #ff2e3d; transform: scale(1.05); }

        /* Main Experience (Initially Hidden) */
        #main-experience { display: none; }
        #wish-page { height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; text-align: center; }
        #launch-btn { 
            background: none; color: #ff4757; border: 2px solid #ff4757; 
            padding: 18px 40px; font-size: 1.1rem; border-radius: 50px; cursor: pointer; 
            animation: pulse 2s infinite; letter-spacing: 2px;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); box-shadow: 0 0 20px rgba(255, 71, 87, 0.4); } 100% { transform: scale(1); } }
        
        #wish-box { display: none; padding: 20px; }
        h1 { font-family: 'Great Vibes', cursive; font-size: clamp(3rem, 10vw, 5rem); color: #ff4757; margin: 0; line-height: 1.2; }
        #typewriter { color: #ffafbd; margin-top: 15px; min-height: 24px; letter-spacing: 1px; font-weight: 300; }
        
        #album-trigger { 
            display: none; margin-top: 40px; padding: 12px 30px; 
            background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.2); 
            border-radius: 5px; cursor: pointer; backdrop-filter: blur(10px); 
        }

        /* Album Page */
        #album-page { display: none; padding: 60px 20px; text-align: center; }
        .gallery-header h2 { font-family: 'Great Vibes', cursive; font-size: 3.5rem; color: #ff4757; }
        .container { max-width: 1000px; margin: 40px auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; }
        .card { background: rgba(255,255,255,0.03); border-radius: 20px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); opacity: 0; transform: translateY(30px); transition: 0.8s; }
        .card.show { opacity: 1; transform: translateY(0); }
        .card img { width: 100%; height: 380px; object-fit: cover; transition: 0.5s; }
        .card:hover img { transform: scale(1.1); }
        .card-note { padding: 20px; font-size: 0.85rem; color: #ccc; font-weight: 200; }

        /* Floating Hearts */
        .heart { position: fixed; top: -10%; color: rgba(255, 71, 87, 0.2); animation: moveHearts 10s linear infinite; z-index: -1; pointer-events: none; }
        @keyframes moveHearts { to { transform: translateY(110vh); } }
    </style>
</head>
<body>

    <audio id="myAudio" loop>
        <source src="C:\Users\ARPAN\Desktop\New folder (5)\New folder (5)\love-music.mp3" type="audio/mpeg">
    </audio>

    <div id="pass-screen">
        <h2>For Your Eyes Only ❤️</h2>
        <input type="password" id="pass-input" placeholder="Enter Security Code">
        <button id="pass-btn" onclick="checkPassword()">Unlock Memories</button>
        <p id="error-msg" style="color: #ff4757; margin-top: 15px; display: none; font-size: 0.8rem; letter-spacing: 1px;">Oops! Wrong code. Check again.</p>
    </div>

    <div id="main-experience">
        <section id="wish-page">
            <button id="launch-btn" onclick="startExperience()">Start Our 2026 ❤️</button>
            <div id="wish-box">
                <h1>Happy New Year <br> My Munii ❤️</h1>
                <p id="typewriter"></p>
                <button onclick="openAlbum()" id="album-trigger">OUR BEST MOMENT 2025 📸</button>
            </div>
        </section>

        <section id="album-page">
            <div class="gallery-header">
                <h2>The 2025 Archives</h2>
                <p style="letter-spacing: 3px; opacity: 0.5; font-size: 0.7rem;">MEMORIES WITH YOU</p>
            </div>
            <div class="container">
                <div class="card"><img src="C:\Users\ARPAN\Desktop\New folder (5)\New folder (5)\pic1.jpg"><div class="card-note">Yaad hai ye din?❤️</div></div>
                <div class="card"><img src="C:\Users\ARPAN\Desktop\New folder (5)\New folder (5)\pic2.jpg"><div class="card-note">aap ka Smile 😍</div></div>
                <div class="card"><img src="C:\Users\ARPAN\Desktop\New folder (5)\New folder (5)\pic3.jpg"><div class="card-note">Har pal tere saath special hai✨</div></div>
                <div class="card"><img src="C:\Users\ARPAN\Desktop\New folder (5)\New folder (5)\pic4.jpg"><div class="card-note">Together is my favorite place👫</div></div>
                <div class="card"><img src="C:\Users\ARPAN\Desktop\New folder (5)\New folder (5)\pic5.jpg"><div class="card-note">You Are My Forever </div></div>
                <div class="card"><img src="C:\Users\ARPAN\Desktop\New folder (5)\New folder (5)\pic6.jpg"><div class="card-note">Happy New Year MY JAAN MY SWEET BABY GIRL</div></div>
            </div>
        </section>
    </div>

    <script>
        // Password Check Function
        function checkPassword() {
            const pass = document.getElementById('pass-input').value;
            const correctPassword = "munii2009"; // <--- PASSWORD SET HERE

            if (pass === correctPassword) {
                document.getElementById('pass-screen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('pass-screen').style.display = 'none';
                    document.getElementById('main-experience').style.display = 'block';
                }, 500);
            } else {
                document.getElementById('error-msg').style.display = 'block';
                document.getElementById('pass-input').value = "";
            }
        }

        // Start Experience & Music
        function startExperience() {
            var audio = document.getElementById("myAudio");
            audio.play().catch(e => console.log("Audio play needs interaction first"));

            document.getElementById('launch-btn').style.display = 'none';
            var end = Date.now() + 3000;
            (function frame() {
                confetti({ particleCount: 4, angle: 60, spread: 55, origin: { x: 0, y: 0.6 }, colors: ['#ff4757', '#ffffff'] });
                confetti({ particleCount: 4, angle: 120, spread: 55, origin: { x: 1, y: 0.6 }, colors: ['#ff4757', '#ffffff'] });
                if (Date.now() < end) requestAnimationFrame(frame);
                else showWish();
            }());
        }

        function showWish() {
            document.getElementById('wish-box').style.display = 'block';
            let text = "You Are The Biggest Blessing Given By God To Me ";
            let i = 0;
            function type() {
                if(i < text.length) { 
                    document.getElementById("typewriter").innerHTML += text.charAt(i); 
                    i++; 
                    setTimeout(type, 100); 
                } else { 
                    document.getElementById('album-trigger').style.display = 'inline-block'; 
                }
            }
            type();
        }

        function openAlbum() {
            document.getElementById('wish-page').style.display = 'none';
            document.getElementById('album-page').style.display = 'block';
            window.scrollTo(0,0);
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('show'); });
            }, { threshold: 0.1 });
            document.querySelectorAll('.card').forEach(card => observer.observe(card));
        }

        // Hearts Animation
        setInterval(() => {
            const heart = document.createElement('div');
            heart.classList.add('heart'); heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = Math.random() * 15 + 10 + 'px';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 10000);
        }, 800);
    </script>
</body>
</html>
